name: Terbitkan situs

# Berjalan saat main berubah (termasuk push ekspor harian dari repository KMP)
# atau dijalankan manual. Satu job dan cache npm untuk menghemat menit Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tanggal ubah halaman diambil dari riwayat git

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pasang dependensi
        run: npm ci --no-audit --no-fund

      - name: Susun isi
        run: ./skrip/susun-isi.sh

      - name: Bangun situs
        run: npx quartz build -d content -o public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
